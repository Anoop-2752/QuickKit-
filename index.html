    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Google Consent Mode v2. Storage defaults to denied until the visitor
      // chooses, and a previous choice is replayed here so the default is
      // already correct on repeat visits rather than flipping after hydration.
      var quickkitConsent = null;
      try { quickkitConsent = localStorage.getItem('quickkit_cookie_consent'); } catch (e) {}
      var quickkitGranted = quickkitConsent === 'accepted' ? 'granted' : 'denied';
      gtag('consent', 'default', {
        ad_storage: quickkitGranted,
        ad_user_data: quickkitGranted,
        ad_personalization: quickkitGranted,
        analytics_storage: quickkitGranted,
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });

      gtag('js', new Date());
      gtag('config', 'G-YBPV68L760');
    </script>
